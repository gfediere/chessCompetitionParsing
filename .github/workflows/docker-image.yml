name: Docker Image CI

on:
  push:
    tags:
      - '*.*.*'
      - 'v*.*.*'
      - '*.*.*-*'
      - 'v*.*.*-*'
      - '*.*-*'
      - 'v*.*-*'

jobs:
  build-scan-push:
    name: Build, Scan & Push
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: fed12/chesscompetitionparsing
      POLICY: ${{ vars.POLICY }}

    steps:
      # 1. Récupération du code
      - name: Check out repository
        uses: actions/checkout@v4

      # 2. Préparation des tags/labels Docker avec Fallback garanti
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      # 3. Connexion à Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # 4. Configuration de Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. Build local de l'image (pour le scan Wiz)
      - name: Build image locally for scan
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: ${{ env.IMAGE_NAME }}:test-scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 6. Installation de Wiz CLI
      #- name: Download Wiz CLI
      #  run: curl -o wizcli https://wizcli.app.wiz.io/latest/wizcli && chmod +x wizcli

      # 7. Authentification auprès de Wiz
      #- name: Authenticate to Wiz
      #  run: ./wizcli auth --id "$WIZ_CLIENT_ID" --secret "$WIZ_CLIENT_SECRET"
      #  env:
      #    WIZ_CLIENT_ID: ${{ secrets.WIZ_CLIENT_ID }}
      #    WIZ_CLIENT_SECRET: ${{ secrets.WIZ_CLIENT_SECRET }}

      # 8. Scan de l'image (poursuit l'exécution en cas d'erreur de la CLI Wiz)
      #- name: Run wiz-cli docker image scan
      #  continue-on-error: true
      #  run: ./wizcli docker scan --image ${{ env.IMAGE_NAME }}:test-scan --policy "$POLICY"

      # 9. Push sur Docker Hub
      - name: Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max